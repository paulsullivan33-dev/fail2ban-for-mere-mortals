site_name: Fail2Ban for Mere Mortals
site_description: Plain-language fail2ban — the log-watching bouncer that reads service logs and bans repeat offenders, jails, filters and actions explained, a first ban watched end to end in a safe lab, and the firewall itself checked afterwards.
