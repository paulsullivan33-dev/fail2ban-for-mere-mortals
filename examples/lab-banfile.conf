# Lab action written for the fail2ban Mere Mortals guide.
# Instead of touching the firewall, it appends one line per ban or
# unban to a file in the lab, so a ban can be watched happening
# with zero risk to the machine.
[Definition]
actionstart =
actionstop =
actioncheck =
actionban   = echo "BAN ip=<ip> jail=<name> failures=<failures>" >> /home/hatch/workspace/fail2ban-lab/bans.log
actionunban = echo "UNBAN ip=<ip> jail=<name>" >> /home/hatch/workspace/fail2ban-lab/bans.log

[Init]
